[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditfl"
version = "0.1.0"
description = "AuditFL implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "torchvision>=0.16", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["auditfl*"]
